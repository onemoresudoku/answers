<html lang="uk">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sudoku — Відповіді</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #f5f3ee;
    color: #1c1c1c;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 90%;
    max-width: 900px;
    margin: auto;
    padding: 60px 0;
}


/* =========================
   HEADER
========================= */

header {
    text-align: center;
    margin-bottom: 55px;
}

.logo {
    font-size: 12px;
    letter-spacing: 5px;
    margin-bottom: 15px;
}

h1 {
    font-size: 48px;
    font-weight: 400;
    margin-bottom: 15px;
}

.subtitle {
    color: #777;
    font-size: 16px;
    line-height: 1.5;
}


/* =========================
   ВИБІР СУДОКУ
========================= */

.selection-title {
    text-align: center;
    font-size: 20px;
    font-weight: 400;
    margin-bottom: 25px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.sudoku-button {
    background: transparent;
    border: 1px solid #1c1c1c;
    padding: 15px 5px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.sudoku-button:hover {
    background: #1c1c1c;
    color: white;
}


/* =========================
   ВІДПОВІДЬ
========================= */

.answer {
    margin-top: 50px;
    text-align: center;
}

.answer-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #777;
    margin-bottom: 8px;
}

.answer-title {
    font-size: 30px;
    font-weight: 400;
    margin-bottom: 30px;
}


/* =========================
   СІТКА SUDOKU
========================= */

.sudoku-grid {
    width: min(500px, 90vw);
    aspect-ratio: 1 / 1;

    margin: 0 auto 35px;

    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);

    border: 3px solid #1c1c1c;
    background: #1c1c1c;
}

.cell {
    background: #f5f3ee;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: clamp(18px, 4vw, 30px);

    border-right: 1px solid #aaa;
    border-bottom: 1px solid #aaa;
}


/* вертикальні товсті лінії */

.cell:nth-child(3n) {
    border-right: 2px solid #1c1c1c;
}

.cell:nth-child(9n) {
    border-right: none;
}


/* горизонтальні товсті лінії */

.cell:nth-child(n+19):nth-child(-n+27),
.cell:nth-child(n+46):nth-child(-n+54) {
    border-bottom: 2px solid #1c1c1c;
}

.cell:nth-child(n+73) {
    border-bottom: none;
}


/* =========================
   КНОПКА НАЗАД
========================= */

.back-button {
    background: none;
    border: none;

    font-size: 15px;

    cursor: pointer;

    text-decoration: underline;
    text-underline-offset: 4px;
}

.back-button:hover {
    opacity: 0.5;
}


/* =========================
   ПРИХОВАННЯ
========================= */

.hidden {
    display: none;
}


/* =========================
   ТЕЛЕФОН
========================= */

@media (max-width: 600px) {

    .container {
        padding: 40px 0;
    }

    h1 {
        font-size: 38px;
    }

    .buttons {
        grid-template-columns: repeat(4, 1fr);
    }

    .sudoku-button {
        padding: 13px 5px;
    }

}

</style>
</head>

/* =====================================================
   СТВОРЕННЯ КНОПОК
===================================================== */

const buttons = document.getElementById("buttons");


Object.keys(sudokuAnswers).forEach(number => {

    const button = document.createElement("button");

    button.className = "sudoku-button";

    button.textContent =
        String(number).padStart(2, "0");


    button.onclick = function() {

        showAnswer(number);

    };


    buttons.appendChild(button);

});



/* =====================================================
   ПОКАЗАТИ ВІДПОВІДЬ
===================================================== */

function showAnswer(number) {

    const grid =
        document.getElementById("grid");

    const title =
        document.getElementById("answerTitle");

    const selection =
        document.getElementById("selection");

    const answer =
        document.getElementById("answer");


    /* очищаємо стару сітку */

    grid.innerHTML = "";


    /* назва */

    title.textContent =
        "Судоку №" +
        String(number).padStart(2, "0");


    /* створюємо клітинки */

    sudokuAnswers[number].forEach(row => {

        row.forEach(value => {

            const cell =
                document.createElement("div");

            cell.className = "cell";

            cell.textContent = value;

            grid.appendChild(cell);

        });

    });


    /* показуємо відповідь */

    selection.classList.add("hidden");

    answer.classList.remove("hidden");


    /* повертаємо сторінку нагору */

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =====================================================
   ПОВЕРНУТИСЯ ДО ВИБОРУ
===================================================== */

function backToSelection() {

    document
        .getElementById("answer")
        .classList.add("hidden");


    document
        .getElementById("selection")
        .classList.remove("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}
